[project]
name = "uptime"
version = "0.1.0"
description = "Website uptime monitor: REST API and probe worker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "httpx2>=2.16.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
