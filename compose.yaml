name: uptime-platform

x-app: &app
  build: ./app
  image: uptime-app:dev
  environment:
    PGHOST: db
    PGUSER: uptime
    PGPASSWORD: uptime
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./app/src/uptime/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: pg_isready -U uptime
      interval: 2s
      retries: 15

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: python -m uptime.worker
    ports:
      - "127.0.0.1:8001:8001"

  demo-site:
    image: nginx:1.29-alpine

volumes:
  db-data:
